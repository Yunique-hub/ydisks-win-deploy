<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Ydisks 闲鱼助手 · Windows 一键部署工具链">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#1b2a4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="20" fill="url(#bg)"/>
  <circle cx="1040" cy="40" r="150" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="120" cy="260" r="120" fill="url(#glow)" filter="url(#soft)"/>

  <g opacity="0.16" stroke="#7dd3fc" stroke-width="1" fill="none">
    <path d="M0 210 H1200"/>
    <path d="M0 240 H1200"/>
    <path d="M90 0 V280"/>
    <path d="M1110 0 V280"/>
  </g>

  <g transform="translate(64,66)">
    <rect width="76" height="76" rx="18" fill="#0f172a" stroke="url(#accent)" stroke-width="2"/>
    <path d="M20 26 L36 38 L20 50" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M42 52 H58" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="164" y="102" font-family="Segoe UI, Microsoft YaHei, system-ui, sans-serif" font-size="46" font-weight="700" fill="#f8fafc">
