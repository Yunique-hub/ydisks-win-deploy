  </text>

  <g transform="translate(64,206)">
    <rect width="196" height="34" rx="17" fill="#0f766e" fill-opacity="0.28" stroke="#2dd4bf" stroke-opacity="0.55"/>
    <text x="98" y="23" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#5eead4">无需 Docker / 无需 Go</text>
  </g>
  <g transform="translate(276,206)">
    <rect width="150" height="34" rx="17" fill="#1e3a8a" fill-opacity="0.30" stroke="#60a5fa" stroke-opacity="0.55"/>
    <text x="75" y="23" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#93c5fd">纯本地 · 127.0.0.1</text>
  </g>
  <g transform="translate(442,206)">
    <rect width="176" height="34" rx="17" fill="#4c1d95" fill-opacity="0.28" stroke="#a78bfa" stroke-opacity="0.55"/>
    <text x="88" y="23" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#c4b5fd">可重复执行 · 幂等</text>
  </g>

  <text x="1136" y="240" text-anchor="end" font-family="Cascadia Mono, Consolas, monospace" font-size="14" fill="#64748b">
